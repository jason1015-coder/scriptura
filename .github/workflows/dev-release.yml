name: Dev Release (update dev tag)

# Rolling development release.
#
# "build", "deploy", and "test" all live under these workflows:
#   - build.yml   = "Build & Deploy Scriptura"  (builds + packages installers,
#                     AppImages, .deb, portable ZIPs for all OSes)
#   - test.yml    = "Run Unit Tests"
#
# This workflow is lazy: it does NOT start on every push. Instead it triggers
# ONLY when "Build & Deploy Scriptura" (build + deploy) COMPLETES, then it
# verifies the "Run Unit Tests" workflow also SUCCEEDED for that same commit.
# If all three (build + deploy + test) passed -> it immediately creates/updates
# the "dev" tag / "scriptura-dev" release with every artifact. If any failed it
# does nothing.

on:
  workflow_run:
    workflows: ["Build & Deploy Scriptura"]
    types: [completed]

permissions:
  contents: write   # update/create the release and move the git tag
  actions: read     # list run status and download artifacts of other workflows

concurrency:
  group: dev-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  update-dev-release:
    name: Update scriptura-dev release
    runs-on: ubuntu-latest
    # Only act on pushed commits (main/master). PR-triggered runs are ignored.
    if: github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Gate: all of build + deploy + test must have passed ──
      # build + deploy already finished (this workflow is triggered by their
      # completion); only the TEST workflow may still be running, so wait
      # (bounded) for it to reach a final conclusion.
      - name: Check build/deploy + wait for test, allow release only if all pass
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TEST_WORKFLOW: test.yml
        run: |
          set -e
          echo "Build+Deploy run=$BUILD_RUN_ID conclusion=$BUILD_CONCLUSION"
          if [ "$BUILD_CONCLUSION" != "success" ]; then
            echo "::warning Build & Deploy did not pass ($BUILD_CONCLUSION); skipping."
            echo "gated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          max_tries=90                # wait up to ~90 min for the test workflow
          interval=60                 #   (poll every 60s)
          i=0
          t_state="missing"; t_id=""

          while [ "$i" -lt "$max_tries" ]; do
            meta="$(gh run list --workflow "$TEST_WORKFLOW" --branch "$HEAD_BRANCH" \
                     --commit "$HEAD_SHA" --limit 1 --json databaseId,status,conclusion \
                     --jq '.[0] // {}')"
            status="$(printf '%s' "$meta" | jq -r '.status // "missing"')"
            concl="$(printf '%s' "$meta" | jq -r '.conclusion // ""')"
            id="$(printf '%s' "$meta" | jq -r '.databaseId // ""')"

            if [ "$status" = "missing" ] || [ "$status" != "completed" ]; then
              t_state="running"
              echo "[poll $i] test=$t_state (waiting...)"
            else
              t_state="$concl"; t_id="$id"
              echo "[poll $i] test=$t_state"
              break
            fi
            sleep "$interval"
            i=$((i + 1))
          done

          echo "Final -> build+deploy=success, test=$t_state ($t_id)"
          if [ "$t_state" = "success" ]; then
            echo "::notice All of build, deploy, and test passed. Publishing dev release."
            echo "gated=true"  >> "$GITHUB_OUTPUT"
          else
            echo "::warning Test did not pass (state=$t_state); skipping release update."
            echo "gated=false" >> "$GITHUB_OUTPUT"
          fi
          echo "test_run_id=$t_id" >> "$GITHUB_OUTPUT"
# ── Download ALL artifacts produced by the build+deploy run ──
      - name: Download build+deploy artifacts
        if: steps.gate.outputs.gated == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build-artifacts

      # ── Download artifacts produced by the test run (e.g. coverage) ──
      - name: Download test artifacts
        if: steps.gate.outputs.gated == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.gate.outputs.test_run_id }}
          github-token: ${{ github.token }}
          path: test-artifacts

      # ── Package each artifact into exactly one release asset ──
      - name: Stage release assets
        if: steps.gate.outputs.gated == 'true'
        run: |
          set -e
          mkdir -p release-assets

          package_dir() {
            local dir="$1" dest="$2"
            [ -d "$dir" ] || return 0
            local name; name="$(basename "$dir")"
            ( cd "$dir" && zip -r -q "$OLDPWD/${dest}/${name}.zip" . )
            echo "Staged ${dest}/${name}.zip"
          }

          for dir in build-artifacts/*/; do package_dir "$dir" release-assets; done
          for dir in test-artifacts/*/; do  package_dir "$dir" release-assets; done

          echo "=== Release assets ==="
          ls -la release-assets/

      # ── Create or UPDATE the dev tag / scriptura-dev release ──
      # Fixed tag name => an existing release is updated and the git tag is
      # force-moved to this commit — never a brand-new tag.
      - name: Create/update dev release
        if: steps.gate.outputs.gated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: scriptura-dev
          body: |
            Rolling development build (auto-generated).

            - Updated when **Build & Deploy Scriptura** (build + deploy) **and**
              **Run Unit Tests** (test) all succeed on the `main` branch.
            - Assets always overwrite the previous `dev` build.
            - Commit: ${{ github.event.workflow_run.head_sha }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}