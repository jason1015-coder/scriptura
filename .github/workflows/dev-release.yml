name: Dev Release (update dev tag)

# Rolling development release.
#
# This workflow is lazy: it does NOT start on every push. Instead it triggers
# ONLY when "Deploy Scriptura (Manual)" workflow COMPLETES.
# If deploy passed -> it immediately creates/updates the "dev" tag /
# "scriptura-dev" release with every artifact. If it failed it does nothing.

on:
  workflow_run:
    workflows: ["Deploy Scriptura (Manual)"]
    types: [completed]

permissions:
  contents: write   # update/create the release and move the git tag
  actions: read     # list run status and download artifacts of other workflows

concurrency:
  group: dev-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  update-dev-release:
    name: Update scriptura-dev release
    runs-on: ubuntu-latest
    # Only act on pushed commits (main/master). PR-triggered runs are ignored.
    if: github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Gate: deploy must have passed ──
      # This workflow is triggered by deploy completion; check conclusion.
      - name: Check deploy passed
        id: gate
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -e
          echo "Deploy conclusion=$DEPLOY_CONCLUSION"
          if [ "$DEPLOY_CONCLUSION" != "success" ]; then
            echo "::warning Deploy did not pass ($DEPLOY_CONCLUSION); skipping."
            echo "gated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice Deploy passed. Publishing dev release."
          echo "gated=true"  >> "$GITHUB_OUTPUT"
      # ── Download ALL artifacts produced by the deploy run ──
      - name: Download deploy artifacts
        if: steps.gate.outputs.gated == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build-artifacts

      # ── Package each artifact into exactly one release asset ──
      - name: Stage release assets
        if: steps.gate.outputs.gated == 'true'
        run: |
          set -e
          mkdir -p release-assets

          package_dir() {
            local dir="$1" dest="$2"
            [ -d "$dir" ] || return 0
            local name; name="$(basename "$dir")"
            ( cd "$dir" && zip -r -q "$OLDPWD/${dest}/${name}.zip" . )
            echo "Staged ${dest}/${name}.zip"
          }

          for dir in build-artifacts/*/; do package_dir "$dir" release-assets; done

          echo "=== Release assets ==="
          ls -la release-assets/

      # ── Create or UPDATE the dev tag / scriptura-dev release ──
      # Fixed tag name => an existing release is updated and the git tag is
      # force-moved to this commit — never a brand-new tag.
      - name: Create/update dev release
        if: steps.gate.outputs.gated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: scriptura-dev
          body: |
            Rolling development build (auto-generated).

            - Updated when **Deploy Scriptura (Manual)** succeeds
              on the `main` branch.
            - Assets always overwrite the previous `dev` build.
            - Commit: ${{ github.event.workflow_run.head_sha }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}