name: Run Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-tools-dev libqt6sql6-sqlite lcov
      
      - name: Run Rust tests
        run: cd src/rust_backend && cargo test && cd ../..
      
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      
      - name: Build C++ tests
        run: cmake --build build --config Debug -j$(nproc) --target scriptura_tests
      
      - name: Debug - run test binary directly
        run: |
          ls -la build/tests/scriptura_tests 2>&1
          echo "=== Running test binary directly ==="
          QT_QPA_PLATFORM=offscreen build/tests/scriptura_tests 2>&1 || echo "Exit code: $?"
      
      - name: Run C++ unit tests
        run: cd build && ctest --output-on-failure --timeout 300

      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info --rc branch_coverage=1 2>/dev/null || true
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --rc branch_coverage=1 2>/dev/null || true
          lcov --list coverage.info --rc branch_coverage=1 2>/dev/null || echo "Coverage report generated (partial)"
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info
          retention-days: 7

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Install Qt
        run: brew install qt
      
      - name: Run Rust tests
        run: cd src/rust_backend && cargo test && cd ../..
      
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=/opt/homebrew/opt/qt -DBUILD_TESTING=ON
      
      - name: Build C++ tests
        run: cmake --build build --config Debug -j$(sysctl -n hw.ncpu) --target scriptura_tests
      
      - name: Debug - run test binary directly
        run: |
          ls -la build/tests/scriptura_tests 2>&1
          echo "=== Running test binary directly ==="
          QT_QPA_PLATFORM=offscreen build/tests/scriptura_tests 2>&1 || echo "Exit code: $?"
      
      - name: Run C++ unit tests
        run: cd build && ctest --output-on-failure --timeout 300

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          setup-python: 'true'

      - name: Install vcpkg dependencies
        run: vcpkg install zlib:x64-windows

      - name: Run Rust tests
        run: cd src\rust_backend && cargo test && cd ..\..
      
      # NOTE: Windows tests MUST build in Release (or RelWithDebInfo), not Debug.
      # A Debug build selects Qt's pre-built debug libraries (Qt6Cored.lib, etc.)
      # which are compiled with the debug CRT (/MDd), while this project's C++
      # code and the Rust release staticlib use the release CRT (/MD). Mixing the
      # two CRTs in one process gives each its own heap manager (ucrtbase.dll vs
      # ucrtbased.dll); freeing memory across that boundary corrupts the heap,
      # crashing the test binary with STATUS_HEAP_CORRUPTION (0xc0000374) shortly
      # after startup on Windows. Release selects Qt's release libraries (/MD) so
      # the whole process shares a single CRT.
      - name: Configure (MSVC)
        run: cmake -B build -S . -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTING=ON -DCMAKE_VERBOSE_MAKEFILE=ON
      
      - name: Build C++ tests
        run: cmake --build build --config Release --target scriptura_tests --verbose

      - name: Debug - run test binary directly
        run: |
          $env:PATH = "${env:Qt6_DIR}\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          $bin = "build\tests\Release\scriptura_tests.exe"
          if (Test-Path $bin) {
            Write-Host "=== Running test binary directly ==="
            & $bin 2>&1
            Write-Host "Exit code: $LASTEXITCODE"
          } else {
            Write-Host "Binary not found at $bin"
            Get-ChildItem -Recurse build -Filter "scriptura_tests.exe" | Format-List
          }

      - name: Run C++ unit tests
        run: |
          $env:PATH = "${env:Qt6_DIR}\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          cd build
          ctest --output-on-failure -C Release --timeout 300
          if ($LASTEXITCODE -ne 0) { throw "Ctest failed with exit code $LASTEXITCODE" }
