[package]
name = "scriptura-backend"
version = "0.1.0"
edition = "2021"
description = "Rust backend library for Scriptura editor - replaces C++ backend services"

[lib]
name = "scriptura_backend"
crate-type = ["staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
log = "0.4"
tar = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }
semver = "1"
tempfile = "3"
